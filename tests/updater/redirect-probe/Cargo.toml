# Scratch probe, not part of the app or of CI.
#
# Answers one question with evidence instead of recollection: when a request
# carrying `Authorization` is redirected to another host, do the two reqwest
# versions in `src-tauri/Cargo.lock` keep the header off that host for the rest
# of the chain? 0.12 is the app's own client (`src-tauri/src/update/mod.rs`);
# 0.13 is the one inside tauri-plugin-updater, which does the manifest fetch and
# the installer download.
#
# The lockfile next to this manifest is a copy of `src-tauri/Cargo.lock`, so the
# versions probed (reqwest, and tower-http, whose redirect layer reqwest uses)
# are the ones the app ships with.
#
# Run: cargo run --manifest-path tests/updater/redirect-probe/Cargo.toml

[package]
name = "updater-redirect-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
reqwest012 = { package = "reqwest", version = "=0.12.28", default-features = false }
# rustls-no-provider is how the updater plugin builds it; the probe installs
# ring itself, exactly as the plugin does before every request.
reqwest013 = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Standalone: not a member of any workspace above it.
[workspace]
