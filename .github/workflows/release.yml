# Builds and publishes a signed Versorium release.
#
# Push a tag `vX.Y.Z` to cut a stable release, or `vX.Y.Z-beta.N` for the beta
# channel. The release is created as a DRAFT: a human verifies it (see
# RELEASING.md) and publishes it, because the updater starts offering a version
# the moment it is public.
#
# `workflow_dispatch` builds every target without touching a release, for
# checking that the pipeline still compiles.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The one place the canonical repository is named. `github.repository` is
  # correct for any fork, so nothing here hardcodes an owner.
  REPO: ${{ github.repository }}

jobs:
  # Refuse to build before wasting four runners on artifacts the updater would
  # reject. An unsigned release is worse than no release: it installs, and then
  # every client silently fails to verify it.
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Signing key must be configured
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. See RELEASING.md — an unsigned build is rejected by every updater client."
            exit 1
          fi

      - name: Tag must match the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag  tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$crate"
          # The updater compares against tauri.conf.json's version. A tag that
          # disagrees with it produces a release nobody is ever offered.
          if [ "$tag" != "$conf" ]; then
            echo "::error::Tag $tag does not match tauri.conf.json version $conf. The updater would never offer this release."
            exit 1
          fi
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$crate" ]; then
            echo "::error::Versions disagree — tauri.conf.json=$conf package.json=$pkg Cargo.toml=$crate. Bump all three."
            exit 1
          fi

  build:
    needs: [guard]
    # guard is skipped on workflow_dispatch; only a real failure should stop us.
    if: always() && needs.guard.result != 'failure' && needs.guard.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS (Apple silicon)
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS (Intel)
          - platform: ubuntu-22.04
            args: '--features vulkan'
            name: Linux
          - platform: windows-latest
            args: '--features vulkan'
            name: Windows
    runs-on: ${{ matrix.platform }}
    env:
      # llama.cpp uses std::filesystem, which macOS has from 10.15. The Intel
      # build's default deployment target is older and the C++ compile fails
      # ("'path' is unavailable: introduced in macOS 10.15"); the same floor is
      # declared to the bundle in tauri.conf.json. Ignored off macOS.
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      # The default x86_64 Rust target advertises no CPU features, so an x64 build
      # otherwise ships SSE2-baseline kernels and a modern machine runs local
      # inference far slower than its hardware allows. build.rs reads target-cpu
      # from here and forwards -march plus the matching GGML_AVX* defines.
      #
      # x86-64-v2 (SSE4.2, POPCNT) is safe back to roughly 2009. v3 would add
      # AVX2 and be faster but would refuse to start on pre-2013 hardware, which
      # is not a trade to make silently for a writing tool.
      #
      # Do NOT reach for GGML_CPU_ALL_VARIANTS here: ggml FATAL_ERRORs with
      # "requires GGML_BACKEND_DL", which only the crate's dynamic-backends
      # feature sets, and that feature also forces a shared-library build.
      #
      # Written as `!aarch64 && flag || ''`, not `aarch64 && '' || flag`: an
      # empty string is falsy in Actions expressions, so the second form gave
      # the Apple silicon build the x86 flag too, and ring's NEON checks (and,
      # on 1.99, LLVM itself) failed on it.
      RUSTFLAGS: ${{ !contains(matrix.args, 'aarch64') && '-C target-cpu=x86-64-v2' || '' }}
    steps:
      - uses: actions/checkout@v7

      # webkit2gtk-4.1 is the Tauri 2 requirement — 4.0 is Tauri 1 and its
      # absence is the most common reason a Linux job fails.
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            libclang-dev \
            cmake \
            patchelf \
            xdg-utils \
            file \
            wget

      # No `version` input: package.json pins pnpm through `packageManager`
      # (12.4.1), and supplying both makes the action refuse with "Multiple
      # versions of pnpm specified". The comment here previously claimed there
      # was no `packageManager` field; there is.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # Vulkan gives NVIDIA, AMD and Intel one GPU backend. Needed at build time
      # only as headers, the loader import library and glslc — no GPU and no
      # vendor toolchain on the runner. Neither runner image ships it.
      #
      # Linux uses LunarG's jammy repository rather than the distro packages:
      # 22.04's own Vulkan headers are too old for ggml's shader build.
      - name: Install Vulkan SDK (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y vulkan-sdk

      # llama-cpp-sys-2's build script panics outright without VULKAN_SDK set,
      # which this action does.
      - name: Install Vulkan SDK (Windows)
        if: startsWith(matrix.platform, 'windows')
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      # MSVC cannot open files whose path passes 260 characters, and the
      # Vulkan shader generator's CMake try-compile under
      # src-tauri\target\release\build\llama-cpp-sys-2-<hash>\out\build\ggml\…
      # does ("C1083: Cannot open source file"). A short target directory
      # keeps every path under the limit; tauri build reads CARGO_TARGET_DIR,
      # so the bundles are found there.
      - name: Short build directory (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV

      # Pinned to the toolchain the app is developed and tested with, so a
      # release is built the way it was tested. (The SIGSEGV first blamed on
      # 1.99.0 came from the x86 RUSTFLAGS reaching the aarch64 build; see
      # above.) Move the pin deliberately, after a release build passes.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.args }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Stable tags carry no suffix; anything after the patch number is a beta.
      - name: Classify the release
        id: channel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # On a tag push: build, sign, and upload into a draft release.
      - name: Build and upload
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Versorium ${{ github.ref_name }}
          # The old note said "right-click and choose Open". That stopped
          # working: on current macOS a quarantined bundle with no Developer ID
          # signature is reported as damaged, and right-click does not get past
          # it. The quarantine flag has to be cleared.
          releaseBody: |
            ## English
            Download this version from the assets below.

            ### macOS will say the app is damaged. It is not.
            The bundle carries no Developer ID signature, so macOS quarantines it and
            Gatekeeper reports the most misleading message it has. Clear the quarantine
            flag once, in Terminal:

            ```
            xattr -rd com.apple.quarantine /Applications/Versorium.app
            ```

            Run it only on a build you took from this release page — that flag is the
            check that protects you from a tampered download.

            ### SmartScreen will interrupt the installer.
            The installer is unsigned for the same reason the macOS bundle is, so Windows
            shows the blue "Windows protected your PC" screen. Choose **More info**, then
            **Run anyway**. Signed builds need Apple and Microsoft
            certificates, which the project does not have yet.

            Updates are verified against Versorium's own signing key either way: an
            update that was not signed by it is refused.

            ## Español
            Descarga esta versión desde los archivos de abajo.

            ### macOS dirá que la app está dañada. No lo está.
            El paquete no lleva firma de Developer ID, así que macOS lo pone en cuarentena
            y Gatekeeper muestra el mensaje más engañoso que tiene. Quita la marca de
            cuarentena una sola vez, en Terminal:

            ```
            xattr -rd com.apple.quarantine /Applications/Versorium.app
            ```

            Hazlo solo con una copia descargada de esta página de releases — esa marca es
            la comprobación que te protege de una descarga manipulada.

            ### SmartScreen interrumpirá el instalador.
            El instalador no está firmado por la misma razón que el paquete de macOS, así
            que Windows muestra la pantalla azul "Windows protegió su PC". Elige **Más
            información** y después **Ejecutar de todas formas**. Las versiones firmadas
            necesitan certificados de Apple y de Microsoft, que el proyecto aún no tiene.

            Las actualizaciones se verifican siempre contra la clave de firma de
            Versorium: una actualización que no venga firmada por ella se rechaza.
          # Draft, so a human checks latest.json and the checksums before any
          # client is offered the update.
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          args: ${{ matrix.args }}
          retryAttempts: 2

      # On workflow_dispatch: build only. Omitting tagName/releaseName/releaseId
      # is the documented way to make the action upload nothing.
      - name: Build only (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: versorium-${{ matrix.platform }}${{ matrix.args }}

  # Everything the spec asks for that tauri-action does not do: a SHA256SUMS
  # asset, and a latest.json whose URLs a private repository can actually serve.
  finalise:
    needs: [build]
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Collect the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$REPO" --clobber
          ls -la

      # Spec §11 wants minisign *and* sha256. The .sig files are the first half;
      # this is the second, over every installer we publish.
      - name: Write SHA256SUMS
        run: |
          cd assets
          rm -f SHA256SUMS latest.json
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS

      # A private repository does not serve
      # github.com/<owner>/<repo>/releases/download/... even with a token —
      # that path 404s. The API asset endpoint does, with
      # `Accept: application/octet-stream`. tauri-action writes the browser
      # form, so rewrite it to the API form the client actually requests.
      - name: Point latest.json at API asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$REPO/releases/tags/$GITHUB_REF_NAME" --jq '.id')
          gh api --paginate "repos/$REPO/releases/$release_id/assets" > release-assets.json
          python3 - <<'REWRITE'
          import json, os, sys, urllib.parse

          with open("release-assets.json") as f:
              ids = {a["name"]: a["id"] for a in json.load(f)}

          repo = os.environ["REPO"]
          with open("assets/latest.json") as f:
              manifest = json.load(f)

          # tauri-action 1.x already writes the API form for a draft
          # (.../releases/assets/<id>); older versions wrote the browser form
          # (.../download/<tag>/<name>). Accept either, and check the asset
          # really belongs to this release.
          api_prefix = f"https://api.github.com/repos/{repo}/releases/assets/"
          by_id = set(ids.values())
          missing = []
          for target, entry in manifest.get("platforms", {}).items():
              url = entry["url"]
              last = urllib.parse.unquote(url.rsplit("/", 1)[-1])
              if url.startswith(api_prefix) and last.isdigit() and int(last) in by_id:
                  continue
              if last in ids:
                  entry["url"] = f"{api_prefix}{ids[last]}"
              else:
                  missing.append((target, last))

          if missing:
              for target, name in missing:
                  print(f"::error::latest.json names {name} for {target}, which is not an asset of this release")
              sys.exit(1)

          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          REWRITE

      - name: Upload SHA256SUMS and the rewritten latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS latest.json \
            --repo "$REPO" --clobber

      - name: Summary
        run: |
          {
            echo "### Versorium $GITHUB_REF_NAME is built and waiting as a draft"
            echo
            echo "Verify it before publishing — see RELEASING.md."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
