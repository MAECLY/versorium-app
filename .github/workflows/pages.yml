name: Pages

# Publishes the landing page in docs/ (except docs/project/, the project
# documents) to https://versorium.maecly.com (the custom domain is
# docs/CNAME). Same shape as MAECLY's other sites, and the same actions,
# pinned by commit SHA with the release tag beside each one.
#
# GitHub Pages has to be set to "GitHub Actions" as its source. On the Free
# plan Pages only publishes from a public repository.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/project/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish versorium.maecly.com
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # docs/ holds the site and docs/project/ (specs, STATUS, TODO…). Only the
      # site is published; any other Markdown file fails the deploy.
      - name: Stage the site
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -R docs/. "$site/"
          rm -rf "$site/project"
          if find "$site" -name '*.md' | grep -q .; then
            find "$site" -name '*.md'
            echo "::error::a Markdown file would be published"; exit 1
          fi

      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
