[package]
name = "versorium"
version = "0.1.0"
description = "Versorium — local-first novel studio"
authors = ["maecly"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "versorium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
thiserror = "2"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "https"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.11.0"
sysinfo = "0.39.6"
zip = "^5"
quick-xml = "0.42.0"
tauri-plugin-updater = { version = "^2", default-features = false, features = ["rustls-tls"] }
# The updater plugin's own HTTP client is reqwest 0.13, and its redirect policy
# can only be named through that version. The policy is what keeps the updates
# token on api.github.com when the plugin follows an asset download to GitHub's
# storage host (`update::plugin_client`). Already in the tree through the
# plugin, so this adds nothing to the build. If the plugin ever moves to another
# reqwest, `configure_client` stops compiling instead of silently losing the
# rule.
updater-reqwest = { package = "reqwest", version = "0.13", default-features = false }
tauri-plugin-opener = "2.6.0"
# In-process llama.cpp. Pinned exactly: upstream declares no MSRV, publishes
# roughly weekly, and every bump repays the full cmake cost on all four release
# legs. `default-features = false` drops `openmp`, whose build script emits
# `cargo:rustc-link-lib=gomp` on *-gnu targets — a libgomp.so.1 dependency the
# .deb bundler does not declare. `common` is kept for `fit_params`; chat
# templates are unconditional and need no feature.
llama-cpp-2 = { version = "=0.1.157", default-features = false, features = ["common"] }
# Needed to hold a decoder across the generation loop: `token_to_piece` takes
# one so an accented character split across two tokens survives. The deprecated
# `token_to_str` makes a fresh decoder per call and loses exactly that.
encoding_rs = "0.8.35"
# Credentials in the OS store instead of settings.json. The default `v1`
# feature is exactly the three native stores (Keychain, Credential Manager,
# Secret Service); `cli` would pull in nine. No new system packages: the Linux
# backend is zbus, pure Rust.
keyring = "4"
# The OS CSPRNG, for the MCP HTTP bearer token. Already in the tree transitively,
# so declaring it adds nothing to the binary — but a token gating tools that can
# write to a manuscript must come from a real random source, not from mixing the
# clock with a heap address.
getrandom = "0.3"
# Deleting a novel sends it to the system trash, not to oblivion. Git protects a
# deleted chapter; nothing protects a deleted project folder, so the recovery
# has to be the one the writer already knows how to use.
trash = "5"

# WKWebView checks spelling only when the app's defaults ask for it, and asking
# goes through NSUserDefaults (`src/spelling.rs`). Both crates are already in
# the macOS tree through tauri and wry at these versions, so declaring them adds
# nothing to the build and nothing to THIRD-PARTY-NOTICES.md.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSDictionary",
  "NSString",
  "NSUserDefaults",
  "NSValue",
] }

[features]
# GPU offload on Windows and Linux. Off by default and switched on only in the
# release workflow for those two targets, because it needs the Vulkan SDK at
# build time and adds roughly 42 MB to the artifact.
#
# macOS must never get this: Metal is already on there via llama.cpp's own APPLE
# CMake default, and Vulkan would be a second backend nobody asked for.
#
# One Vulkan backend covers NVIDIA, AMD and Intel. CUDA is deliberately not
# offered: it needs the full toolkit on every runner and ships ~390 MB of
# redistributables, for hardware Vulkan already reaches.
vulkan = ["llama-cpp-2/vulkan"]

[dev-dependencies]
tempfile = "3"
# Only so a test can build the plugin's reqwest client: the plugin compiles it
# with `rustls-no-provider` and installs ring itself before every request, and
# the redirect tests must do the same. Already in the tree, ring included.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
